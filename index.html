<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Аватар-Ассистент Стана</title>

    <!-- 1. Подключение A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- 2. Подключение AR.js для A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- 3. Подключение aframe-extras для работы с анимациями (animation-mixer) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 15px;
            color: white;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #chat-output {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            min-height: 60px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.4;
        }

        #input-row {
            display: flex;
            gap: 10px;
        }

        #text-input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #mic-btn {
            background: #ff4757;
            color: white;
        }

        #mic-btn.listening {
            background: #2ed573;
            animation: pulse 1.5s infinite;
        }

        #send-btn {
            background: #1e90ff;
            color: white;
        }

        #send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #stop-btn {
            background: #ff6b6b;
            color: white;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .arjs-loader { display: none; }
    </style>
</head>

<body>

    <div id="ui-container">
        <div id="chat-output">Привет! Я AR-ассистент прокатного стана. Спросите меня о характеристиках оборудования (например: "Какая мощность двигателя?" или "Из чего сделаны валки?").</div>
        <div id="input-row">
            <button id="mic-btn" class="btn">🎤</button>
            <input type="text" id="text-input" placeholder="Введите вопрос...">
            <button id="send-btn" class="btn">➤</button>
            <button id="stop-btn" class="btn">⏹</button>
        </div>
    </div>

    <!-- Добавлены настройки рендера для лучшей работы со свечением (emissive) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="physicallyCorrectLights: true; toneMapping: ACESFilmic; toneMappingExposure: 2.0; colorManagement: true;">
        
        <a-assets>
            <a-asset-item id="tank-model" src="./models/StanNew.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="./pattern-Stan_pattern.patt">
            
            <!-- ========== СИЛЬНОЕ СТУДИЙНОЕ ОСВЕЩЕНИЕ ========== -->
            
            <!-- Ambient - базовое заполнение, чтобы не было чёрных теней -->
            <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
            
            <!-- Основной свет - сверху-спереди-справа (как на скриншоте Blender) -->
            <a-light type="directional" 
                    color="#ffffff" 
                    intensity="2.5" 
                    position="2 3 2"
                    target="#target-object"></a-light>
            
            <!-- Заполняющий свет - сверху-слева-сзади -->
            <a-light type="directional" 
                    color="#ffffff" 
                    intensity="1.8" 
                    position="-2 2 -2"
                    target="#target-object"></a-light>
            
            <!-- Контровой свет - сзади-сверху (подчёркивает контуры) -->
            <a-light type="directional" 
                    color="#ffffff" 
                    intensity="1.5" 
                    position="0 3 -3"
                    target="#target-object"></a-light>
            
            <!-- Подсветка снизу-спереди (убирает тени снизу) -->
            <a-light type="directional" 
                    color="#ffffff" 
                    intensity="1.2" 
                    position="1 -1 2"
                    target="#target-object"></a-light>
            
            <!-- Point light прямо над моделью для бликов -->
            <a-light type="point" 
                    color="#ffffff" 
                    intensity="2.0" 
                    distance="15" 
                    decay="1" 
                    position="0 4 0"></a-light>
            
            <!-- Hemisphere light для естественного градиента небо/земля -->
            <a-light type="hemisphere" 
                    color="#ffffff" 
                    groundColor="#aaaaaa" 
                    intensity="0.8"></a-light>

            <!-- Целевой объект (стан) -->
            <a-entity id="target-object" 
                    gltf-model="#tank-model" 
                    position="0 0 0" 
                    rotation="0 0 0" 
                    scale="0.8 0.8 0.8">
            </a-entity>
            
            <!-- Аватар (заглушка) -->
            <a-entity id="avatar" 
                    gltf-model="#avatar-model" 
                    position="0 0.5 -1" 
                    rotation="0 0 0" 
                    scale="1 1 1"
                    animation-mixer="clip: Idle; loop: true; crossFadeDuration: 0.5">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ==========================================
        // 1. КОНФИГУРАЦИЯ
        // ==========================================
        let OPENROUTER_API_KEY = "";
        let MODEL_NAME = "";

        const avatarEntity = document.querySelector('#avatar');
        const objectEntity = document.querySelector('#target-object');
        const chatOutput = document.getElementById('chat-output');
        const textInput = document.getElementById('text-input');
        const micBtn = document.getElementById('mic-btn');
        const sendBtn = document.getElementById('send-btn');
        const stopBtn = document.getElementById('stop-btn');

        async function loadConfig() {
            try {
                const response = await fetch('./env.json');
                if (!response.ok) {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }
                const config = await response.json();
                OPENROUTER_API_KEY = config.OPENROUTER_API_KEY;
                MODEL_NAME = config.MODEL_NAME;
                console.log("✅ Конфигурация успешно загружена из env.json");
                
                // Запускаем инициализацию приложения только после загрузки ключей
                initializeApp();
            } catch (error) {
                console.error("❌ Ошибка загрузки env.json:", error);
                chatOutput.textContent = "Ошибка: не удалось загрузить настройки. Убедитесь, что файл env.json существует и вы используете локальный сервер (не file://).";
            }
        }

        // ==========================================
        // 2. ЛОГИКА ПОДСВЕТКИ МОДЕЛИ (ЧЕРЕЗ THREE.JS)
        // ==========================================

        const originalMaterials = new Map();
        let modelReady = false;

        // Сохраняем материалы при загрузке
        objectEntity.addEventListener('model-loaded', () => {
            console.log(" Модель загружена!");
            
            setTimeout(() => {
                // Получаем THREE.js объект модели
                const model = objectEntity.object3D;
                
                if (!model) {
                    console.error("❌ object3D не найден!");
                    return;
                }
                
                console.log(" Обход всех дочерних объектов THREE.js...");
                let count = 0;
                
                // Обходим все дочерние объекты рекурсивно
                model.traverse((child) => {
                    if (child.isMesh && child.name) {
                        count++;
                        console.log(`  [${count}] "${child.name}"`);
                        
                        // Сохраняем оригинальный материал
                        if (child.material) {
                            originalMaterials.set(child.name, {
                                color: child.material.color ? child.material.color.getHex() : 0x808080,
                                emissive: child.material.emissive ? child.material.emissive.getHex() : 0x000000,
                                emissiveIntensity: child.material.emissiveIntensity || 0
                            });
                        }
                    }
                });
                
                console.log(`✅ Найдено mesh-объектов: ${count}`);
                console.log("📋 Все имена:", Array.from(originalMaterials.keys()));
                modelReady = true;
            }, 1000);
        });

        function highlightPart(modelName) {
            console.log(`💡 Подсветка: ${modelName}`);
            const model = objectEntity.object3D;
            if (!model) return;
            
            let highlighted = 0;
            
            model.traverse((child) => {
                if (child.isMesh && child.name) {
                    // Точное совпадение или содержит имя
                    if (child.name.toLowerCase().includes(modelName.toLowerCase())) {
                        console.log(`  ✅ Найдено: ${child.name}`);
                        
                        if (child.material) {
                            child.material = child.material.clone();
                            child.material.color.setHex(0xFFFF00);
                            child.material.emissive.setHex(0xFFFF00);
                            child.material.emissiveIntensity = 0.8;
                            child.material.needsUpdate = true;
                            highlighted++;
                        }
                    }
                }
            });
            
            if (highlighted === 0) {
                console.warn(`  ️ Не найдено: ${modelName}`);
            }
        }

        function resetHighlights() {
            console.log("🔄 Сброс подсветки");
            const model = objectEntity.object3D;
            let reset = 0;
            
            model.traverse((child) => {
                if (child.isMesh && child.name && originalMaterials.has(child.name)) {
                    const original = originalMaterials.get(child.name);
                    
                    if (child.material) {
                        child.material.color.setHex(original.color);
                        child.material.emissive.setHex(original.emissive);
                        child.material.emissiveIntensity = original.emissiveIntensity;
                        child.material.needsUpdate = true;
                        reset++;
                    }
                }
            });
            
            console.log(`  Восстановлено: ${reset}`);
        }

        // ==========================================
        // 3. WEB SPEECH API (Распознавание и Синтез)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                chatOutput.textContent = "Слушаю ваш вопрос...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                textInput.value = transcript;
                processUserInput(transcript);
            };
        } else {
            micBtn.style.display = 'none';
            chatOutput.textContent = "Голосовой ввод не поддерживается вашим браузером.";
        }

        function cleanMarkdown(text) {
            return text
                .replace(/\*\*/g, '')
                .replace(/\*/g, '')
                .replace(/__/g, '')
                .replace(/`/g, '')
                .replace(/#/g, '')
                .replace(/\n/g, ' ');
        }

        function speakText(text, partsToHighlight = []) {
            if ('speechSynthesis' in window) {
                const cleanText = cleanMarkdown(text);
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                utterance.onstart = () => {
                    if(avatarEntity) setAvatarAnimation('Talk');
                    if(objectEntity) objectEntity.setAttribute('visible', 'true');
                    
                    stopBtn.style.display = 'inline-block';
                    sendBtn.disabled = true;

                    // Подсвечиваем части, которые указала нейросеть
                    console.log(" Подсвечиваем части:", partsToHighlight);
                    partsToHighlight.forEach(partName => {
                        highlightPart(partName);
                    });
                };

                utterance.onend = () => {
                    if(avatarEntity) setAvatarAnimation('Idle');
                    
                    stopBtn.style.display = 'none';
                    sendBtn.disabled = false;
                    
                    setTimeout(() => {
                        resetHighlights();
                    }, 1500);
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            if(avatarEntity) setAvatarAnimation('Idle');
            stopBtn.style.display = 'none';
            sendBtn.disabled = false;
            resetHighlights();
        }

        function setAvatarAnimation(animationName) {
            if (avatarEntity) {
                avatarEntity.setAttribute('animation-mixer', 'clip', animationName);
            }
        }

        // ==========================================
        // 4. СИСТЕМНЫЙ ПРОМПТ
        // ==========================================
        const SYSTEM_PROMPT = `Ты — лаконичный AR-ассистент оператора прокатного стана. Отвечай СТРОГО на основе технических характеристик ниже.

ПРАВИЛА:
1. Отвечай кратко: 1-2 предложения, если не просят подробно.
2. На вопрос "Что такое стан?" отвечай ТОЛЬКО: "Это оборудование для пластической деформации металла".
3. Если информации нет, отвечай: "В моей базе данных нет информации об этом".
4. Пиши текст без markdown (без **, без -), готовый для голосовой озвучки.

ФОРМАТ ОТВЕТА — СТРОГО JSON:
{
  "parts": ["ИмяЧасти1", "ИмяЧасти2"],
  "text": "Твой текстовый ответ пользователю"
}

Правила для поля "parts":
- Указывай ТОЛЬКО те части, о которых идёт речь в ответе
- Если часть не упоминается — НЕ включай её в список
- Используй ТОЧНЫЕ имена из списка ниже
- Если вопрос общий (например "что такое стан?"), оставь массив пустым: "parts": []

ДОСТУПНЫЕ ИМЕНА ЧАСТЕЙ:
- Platform (станина)
- ElecMotor (электродвигатель, мотор, привод)
- PinionStand (шестеренная клеть)
- Rolls (валки)
- Spindel (шпиндель)
- MotorCoupling (моторная муфта)
- MasterCoupling (коренная муфта)
- Gearbox (редуктор)
- BalancingDevice (уравновешивающее устройство)
- ScrewdownMechanism (нажимное устройство)

ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ СТАНА:
1. Валки: Назначение: Пластическая деформация металла. Материал: Чугун. Состояние: Гладкие. Обработка: Шлифование. Диаметр бочки: 200 мм. Длина бочки: 450 мм. Диаметр шейки: 75 мм. Длина шейки: 100 мм. Диаметр приводного конца: наружный 65 мм, внутренний 50 мм. Длина приводного конца: 100 мм.
2. Привод стана (двигатель): Род тока: Переменный. Тип: Асинхронный. Напряжение: 380 В. Мощность: 4,2 кВт. Обороты: 1450 об/мин. Реверсивность: Не реверсивный. Регулировка оборотов: Отсутствует. Пусковое устройство: Кнопочное.
3. Коренная муфта: Назначение: Соединение от валов редуктора к шестеренной клети. Тип: Жесткая. Диаметр: 350 мм. Длина: 270 мм.
4. Моторная муфта: Назначение: Соединение от двигателя к редуктору. Тип: Жесткая. Диаметр: 150 мм. Длина: 200 мм.
5. Нажимное устройство: Назначение: Регулировка зазора между валками. Тип: Винтовое. Шаг нарезки: 6 мм. Диаметр винта: внутренний 61 мм, внешний 68 мм. Привод: Штурвал, редуктор. Передаточное число редуктора: 1,2. Значение одного оборота штурвала: 5 мм. Макс. высота подъёма верхнего валка: 80 мм. Смазка: Солидол.
6. Редуктор: Количество: 1. Назначение: Снижение оборотов двигателя. Тип: Двухступенчатый червячный. Тип зубьев: Шевронный. Общее передаточное число: 525. Смазка: Автол.
7. Станина: Назначение: Установка и фиксация валков и арматуры. Материал: Сталь. Ширина окна: 240 мм. Высота окна: 570 мм. Общая высота: 820 мм. Расстояние между станинами: 530 мм. Расстояние от пола до линии прокатки: 900 мм.
8. Уравновешивающее устройство: Назначение: Удержание подушек верхнего валка, прижатие верхнего валка к нажимному устройству. Тип: Пружинный.
9. Шпиндель: Назначение: Передача крутящего момента. Тип: Универсальный. Диаметр: 50 мм. Длина: 400 мм.
10. Шестеренная клеть: Назначение: Передача крутящего момента на 2 вала. Тип: ДУО. Станина: Литая. Диаметр начальной окружности: 220 мм. Тип зуба: Прямой. Подшипники шестеренных валков: Качения. Смазка зубьев и подшипников: Автол.
11. Подушки: Назначение: Установка подшипников. Материал: Сталь. Высота: 210 мм. Ширина: 200 мм. Осевая регулировка: Болтовая.`;
        // ==========================================
        // 5. ЛОГИКА БОТА
        // ==========================================
        async function processUserInput(text) {
            chatOutput.textContent = `Вы: ${text}`;
            sendBtn.disabled = true;
            sendBtn.textContent = "⏳";

            try {
                console.log("Отправка запроса к OpenRouter...");
                
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "AR Stan Assistant",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": MODEL_NAME,
                        "messages": [
                            {"role": "system", "content": SYSTEM_PROMPT},
                            {"role": "user", "content": text}
                        ],
                        // ВАЖНО: просим модель отвечать только JSON
                        "response_format": { "type": "json_object" }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`HTTP ${response.status}: ${errorData.error?.message || response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error("Нейросеть вернула пустой ответ");
                }

                const rawResponse = data.choices[0].message.content;
                console.log("📦 Сырой ответ от нейросети:", rawResponse);

                // Парсим JSON
                let parsed;
                try {
                    parsed = JSON.parse(rawResponse);
                } catch (e) {
                    console.error("❌ Не удалось распарсить JSON:", e);
                    // Если JSON сломался, пробуем вытащить его из текста
                    const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        parsed = JSON.parse(jsonMatch[0]);
                    } else {
                        throw new Error("Нейросеть вернула не JSON");
                    }
                }

                const partsToHighlight = parsed.parts || [];
                const userText = parsed.text || "Ответ не получен";

                console.log("🎯 Части для подсветки:", partsToHighlight);
                console.log("💬 Текст для пользователя:", userText);

                chatOutput.textContent = `Ассистент: ${userText}`;
                
                // Озвучиваем и подсвечиваем
                speakText(userText, partsToHighlight);

            } catch (error) {
                console.error("🔴 ОШИБКА:", error);
                
                let userErrorMsg = "Ошибка соединения.";
                if (error.message.includes("401")) userErrorMsg = "Неверный API-ключ.";
                else if (error.message.includes("429")) userErrorMsg = "Слишком много запросов.";
                else if (error.message.includes("Failed to fetch")) userErrorMsg = "Нет интернета или CORS.";
                else userErrorMsg = `Ошибка: ${error.message}`;

                chatOutput.textContent = `Ассистент: ${userErrorMsg}`;
                speakText(userErrorMsg, []);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "➤";
                textInput.value = '';
            }
        }

        // ==========================================
        // 6. ОБРАБОТЧИКИ СОБЫТИЙ
        // ==========================================
        function initializeApp() {
            // Web Speech API инициализация
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                window.recognition = new SpeechRecognition();
                window.recognition.lang = 'ru-RU';
                window.recognition.continuous = false;
                window.recognition.interimResults = false;

                window.recognition.onstart = () => {
                    micBtn.classList.add('listening');
                    chatOutput.textContent = "Слушаю ваш вопрос...";
                };

                window.recognition.onend = () => {
                    micBtn.classList.remove('listening');
                };

                window.recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    textInput.value = transcript;
                    processUserInput(transcript);
                };
            } else {
                micBtn.style.display = 'none';
                chatOutput.textContent = "Голосовой ввод не поддерживается вашим браузером.";
            }

            // Обработчики кнопок
            micBtn.addEventListener('click', () => {
                if (window.recognition) {
                    try { window.recognition.start(); } catch (e) { console.warn(e); }
                }
            });

            sendBtn.addEventListener('click', () => {
                const text = textInput.value.trim();
                if (text) processUserInput(text);
            });

            stopBtn.addEventListener('click', () => {
                stopSpeech();
            });

            textInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendBtn.click();
            });
        }

        // Запускаем загрузку конфигурации при старте
        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
