<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Ассистент Стана</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <!-- ВАЖНО: AFRAME и AR.js НЕ подключаются здесь — они загружаются лениво
         из js/ar.js только после успешной проверки камеры -->
</head>

<body>
    <button id="toggle-panel-btn" class="control-btn" title="Справочник деталей">☰</button>
    <button id="toggle-chat-btn" title="Открыть чат">💬</button>
    <button id="stop-btn" class="btn" title="Остановить речь">⏹</button>

    <div id="info-panel">
        <h3>📋 Детали стана</h3>
        <div id="parts-list"></div>
    </div>

    <div id="toast"></div>

    <div id="ui-container">
        <div id="chat-header">
            <h3>💬 Чат с ассистентом</h3>
            <button id="close-chat-btn" title="Закрыть чат">✕</button>
        </div>
        <div id="chat-history"></div>
        <div id="input-row">
            <button id="mic-btn" class="btn" title="Голосовой ввод">🎤</button>
            <input type="text" id="text-input" placeholder="Введите вопрос...">
            <button id="send-btn" class="btn" title="Отправить">➤</button>
        </div>
    </div>

    <!-- Контейнер для динамически создаваемой AR-сцены -->
    <div id="scene-root"></div>

    <!-- Экран-заглушка, если камера недоступна -->
    <div id="camera-fallback">
        <div class="icon">📷</div>
        <h2>Камера недоступна</h2>
        <p id="fallback-text">AR-режим требует доступ к камере.</p>
        <div class="actions">
            <a class="btn-fallback btn-primary" href="/">Перейти в 3D-режим</a>
            <button class="btn-fallback btn-secondary" onclick="StanAR.start()">Повторить попытку</button>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/ar.js"></script>
</body>

</html>
